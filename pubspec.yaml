name: aden_digital
description: "عدن الرقمية - Aden Digital. Official government services app for the citizens of Aden."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Backend
  supabase_flutter: ^2.9.0

  # Firebase (legacy services remain until each feature is migrated)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Maps & Location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Media
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  cached_network_image: ^3.3.1

  # UI / Animations
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.0
  uuid: ^4.4.0
  pin_code_fields: ^8.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/icons/

  # Typography: the Cairo Arabic font is loaded at runtime via the
  # `google_fonts` package (see core/theme/app_theme.dart). If you prefer to
  # bundle it for offline use, drop the .ttf files in assets/fonts/ and
  # uncomment the `fonts:` section below.
  #
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
